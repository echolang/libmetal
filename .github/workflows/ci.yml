name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: Build and test
        env:
          # echoc test forks. Metal is ObjC. Apple aborts the child if
          # +initialize was in flight in the parent. This is the
          # documented escape hatch.
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
        run: echoc test
